# Hindsight 기억 저장소 최소 구성 예시. /opt/hindsight 에 이 파일과 .env, Caddyfile 을 두고 `docker compose up -d`.
# .env 에 넣을 값(이 파일에는 적지 않는다):
#   HINDSIGHT_API_TENANT_API_KEY=<맥들이 함께 쓰는 공유키, 충분히 긴 무작위 문자열>
#   OPENAI_API_KEY=<임베딩·사실 추출용>
#   MEMORY_DOMAIN=memory.example.com
services:
  hindsight:
    image: ghcr.io/vectorize-io/hindsight-api:1.0.0-slim
    container_name: hindsight
    restart: unless-stopped
    environment:
      HINDSIGHT_API_TENANT_EXTENSION: hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension
      HINDSIGHT_API_TENANT_API_KEY: ${HINDSIGHT_API_TENANT_API_KEY}
      HINDSIGHT_API_LLM_PROVIDER: openai
      HINDSIGHT_API_LLM_API_KEY: ${OPENAI_API_KEY}
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: openai
      HINDSIGHT_API_RERANKER_PROVIDER: rrf      # slim 이미지에는 로컬 재정렬 모델이 없다
      HINDSIGHT_API_WORKER_ID: hindsight        # 컨테이너를 다시 만들어도 비동기 작업이 이어지게
    volumes:
      - hindsight_data:/home/hindsight/.pg0
    ports:
      - "127.0.0.1:8888:8888"                   # 백업 스크립트용 루프백. 바깥은 Caddy 로만
  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    environment:
      MEMORY_DOMAIN: ${MEMORY_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  hindsight_data:
  caddy_data:
  caddy_config:
